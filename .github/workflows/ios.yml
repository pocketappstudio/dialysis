name: iOS

# iPhone app build. Lives on the "ios" branch so the live GitHub Pages site (main) is untouched.
on:
  push:
    branches: [ios]
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Archive and upload to TestFlight (needs the App Store Connect secrets)'
        type: boolean
        default: false

jobs:
  simulator-build:
    name: Build for simulator (no signing) + screenshots
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Select Xcode 26 (App Store requires the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npm run build:www
      - run: npx cap sync ios
      - name: Build (App Store web content)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
      - name: Screenshot build (demo data, never shipped)
        run: |
          set -o pipefail
          SHOTS=1 npm run build:www && npx cap copy ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 5
      - name: Simulator screenshots
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl list devicetypes | grep -i iphone
          RT=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-26[-0-9]*' | sort -V | tail -1)
          echo "runtime $RT"
          mkdir -p shots
          for DEV in "iPhone 17 Pro" "iPhone 17 Pro Max"; do
            TYPE=$(xcrun simctl list devicetypes | grep "^$DEV (" | sed -E 's/.*\((com[^)]*)\).*/\1/')
            [ -z "$TYPE" ] && { echo "no $DEV"; continue; }
            UDID=$(xcrun simctl create "shot-$DEV" "$TYPE" "$RT")
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.pocketappstudio.dialysislog
            sleep 12   # first launch: web view warm-up; then the demo steps through screens every 8 s
            xcrun simctl terminate "$UDID" com.pocketappstudio.dialysislog; sleep 2
            xcrun simctl launch "$UDID" com.pocketappstudio.dialysislog; sleep 5
            N=$(echo "$DEV" | tr ' ' '-')
            for i in 1 2 3 4 5 6 7; do xcrun simctl io "$UDID" screenshot "shots/$N-$i.png"; sleep 8; done
            xcrun simctl shutdown "$UDID"
          done
          ls -la shots; sips -g pixelWidth -g pixelHeight shots/*.png | grep -E 'png|pixel'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: shots/

  testflight:
    name: Archive and upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Select Xcode 26 (App Store requires the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Check secrets
        run: |
          for v in KEY_ID ISSUER_ID KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "Missing secret for $v"; exit 1; fi
          done
      - run: npm ci
      - run: npm run build:www
      - run: npx cap sync ios
      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: Archive
        run: |
          xcodebuild archive -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Export and upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
